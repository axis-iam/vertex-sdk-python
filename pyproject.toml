[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "axis-iam-vertex"
version = "0.1.0"
description = "Server-side Python SDK for Axis Vertex resource APIs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "axis-iam" }]
keywords = ["iam", "authentication", "authorization", "rbac", "oidc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/axis-iam/vertex-sdk-python"
Repository = "https://github.com/axis-iam/vertex-sdk-python"
Issues = "https://github.com/axis-iam/vertex-sdk-python/issues"

[project.scripts]
vertex-codegen = "axis_vertex.permission_codegen:main"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
]
django = [
    "django>=5.0",
]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/axis_vertex"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/axis_vertex",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true
